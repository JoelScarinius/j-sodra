name: Sync League Warehouse

on:
  workflow_dispatch:
    inputs:
      provider_season_id:
        description: Wyscout provider season ID
        required: true
        default: "192451"
        type: string

      batch_size:
        description: Event matches processed per invocation
        required: false
        default: "5"
        type: string

  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: j-sodra-league-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LOCAL_API_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
      LOCAL_SYNC_TOKEN: ${{ secrets.SYNC_LEAGUE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate required secrets
        run: |
          test -n "$LOCAL_API_URL"
          test -n "$LOCAL_SYNC_TOKEN"

      - name: Run resumable Ettan Sodra sync
        run: |
          provider_season_id="${{ github.event.inputs.provider_season_id || '192451' }}"
          batch_size="${{ github.event.inputs.batch_size || '5' }}"

          python tools/run_season_sync.py \
            --api-url "$LOCAL_API_URL" \
            --league-id 810 \
            --season-id "$provider_season_id" \
            --team-group-anchor "Jonkopings Sodra" \
            --batch-size "$batch_size" \
            --detail-concurrency 2 \
            --event-concurrency 1 \
            --request-delay-ms 250 \
            --timeout 180
