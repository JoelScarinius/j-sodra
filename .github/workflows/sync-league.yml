name: Sync League Warehouse

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Maximum event matches processed per Edge Function invocation
        required: false
        default: "5"
        type: string
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: j-sodra-league-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LOCAL_API_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
      LOCAL_SYNC_TOKEN: ${{ secrets.SYNC_LEAGUE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required secrets
        run: |
          test -n "$LOCAL_API_URL"
          test -n "$LOCAL_SYNC_TOKEN"

      - name: Run resumable Ettan Sodra sync
        run: |
          python tools/run_season_sync.py \
            --api-url "$LOCAL_API_URL" \
            --league-id 810 \
            --season-id 192451 \
            --team-group-anchor "Jonkopings Sodra" \
            --batch-size "${{ github.event.inputs.batch_size || '5' }}" \
            --detail-concurrency 2 \
            --event-concurrency 1 \
            --request-delay-ms 250 \
            --timeout 180
