name: Refresh Reports

on:
  workflow_dispatch:
    inputs:
      client_run_id:
        description: Client-visible run id from the Supabase refresh function
        required: false
        type: string
      requested_at:
        description: UTC timestamp when refresh was requested
        required: false
        type: string
      force_refresh:
        description: Bypass caches and hit the Wyscout API
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: j-sodra-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      UPLOAD_TO_SUPABASE_STORAGE: "1"
      SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_BUCKET: ${{ secrets.SUPABASE_S3_BUCKET }}
      SUPABASE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
      SUPABASE_S3_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
      SUPABASE_S3_PREFIX: ${{ secrets.SUPABASE_S3_PREFIX }}
      SUPABASE_PUBLIC_BASE_URL: ${{ secrets.SUPABASE_PUBLIC_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analytics refresh
        run: python fetch_football_data.py --force-refresh