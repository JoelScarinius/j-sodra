name: Refresh Reports

on:
  workflow_dispatch:
    inputs:
      client_run_id:
        description: Client-visible run id from the Supabase refresh function
        required: false
        type: string

      requested_at:
        description: UTC timestamp when refresh was requested
        required: false
        type: string

      report_season_id:
        description: Wyscout provider season ID for report output
        required: true
        default: "192451"
        type: string

      force_refresh:
        description: Bypass local report caches
        required: false
        default: false
        type: boolean

  workflow_run:
    workflows:
      - Sync League Warehouse
    types:
      - completed

concurrency:
  group: j-sodra-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      REPORT_SEASON_ID: ${{ github.event.inputs.report_season_id || '192451' }}
      UPLOAD_TO_SUPABASE_STORAGE: "1"
      SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WYSCOUT_PROXY_SHARED_SECRET: ${{ secrets.WYSCOUT_PROXY_SHARED_SECRET }}
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_BUCKET: ${{ secrets.SUPABASE_S3_BUCKET }}
      SUPABASE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
      SUPABASE_S3_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
      SUPABASE_S3_PREFIX: ${{ secrets.SUPABASE_S3_PREFIX }}
      SUPABASE_PUBLIC_BASE_URL: ${{ secrets.SUPABASE_PUBLIC_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate publication configuration
        shell: bash
        run: |
          test -n "$SUPABASE_S3_ENDPOINT"
          test -n "$SUPABASE_S3_BUCKET"
          test -n "$SUPABASE_S3_ACCESS_KEY"
          test -n "$SUPABASE_S3_SECRET_KEY"
          test -n "$SUPABASE_PUBLIC_BASE_URL"
          test -n "$SUPABASE_FUNCTION_URL"
          test -n "$WYSCOUT_PROXY_SHARED_SECRET"

          echo "Publication and proxy configuration is present."

      - name: Validate Wyscout proxy access
        shell: bash
        run: |
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --get \
              --header "Accept: application/json" \
              --header "X-Proxy-Key: ${WYSCOUT_PROXY_SHARED_SECRET}" \
              --data-urlencode "endpoint=/competitions/810/seasons" \
              --data-urlencode "fetch=competition" \
              "${SUPABASE_FUNCTION_URL}"
          )"
          if [[ "$status" != "200" ]]; then
            echo "Proxy smoke test failed with HTTP ${status}"
            cat "$response_file"
            exit 1
          fi
          python - "$response_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if not isinstance(payload, dict) or not isinstance(payload.get("seasons"), list):
              raise SystemExit("Proxy response does not contain a seasons list")
          print(f"Proxy smoke test succeeded: {len(payload['seasons'])} seasons")
          PY

      - name: Run analytics refresh
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                "${{ github.event.inputs.force_refresh }}" == "true" ]]; then
            python run_pipeline.py --force-refresh
          else
            python run_pipeline.py
          fi
